events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;  # hide nginx version

    # ── Gzip compression ──────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=submissions_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m        rate=60r/m;

    # ── Upstream services ─────────────────────────────────────────────
    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8000;  }

    # ─────────────────────────────────────────────────────────────────
    # HTTP → HTTPS redirect
    # Uncomment this block and update server_name after SSL is set up.
    # ─────────────────────────────────────────────────────────────────
    # server {
    #     listen 80;
    #     server_name yourdomain.com www.yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main server block ─────────────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl;            # ← uncomment after adding certs
        server_name _;               # ← replace _ with yourdomain.com

        client_max_body_size 10M;

        # ── SSL certificate paths (Let's Encrypt via Certbot) ─────────
        # Uncomment after running: certbot certonly --nginx -d yourdomain.com
        # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ssl_prefer_server_ciphers on;
        # ssl_session_cache   shared:SSL:10m;

        # ── Security headers ──────────────────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-XSS-Protection         "1; mode=block"                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        # Uncomment after enabling HTTPS:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Static assets: long cache ─────────────────────────────────
        location /_next/static/ {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Next.js image optimisation ────────────────────────────────
        location /_next/image {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=86400";
        }

        # ── Public static files ───────────────────────────────────────
        location /favicon.ico {
            proxy_pass         http://frontend;
            add_header         Cache-Control "public, max-age=86400";
        }

        # ── Submissions rate limit ────────────────────────────────────
        location /api/submissions {
            limit_req zone=submissions_limit burst=3 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── All other API routes ──────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Next.js frontend ──────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
